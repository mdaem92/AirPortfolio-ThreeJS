name: Verify and preview

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_preview:
        description: Deploy a temporary Firebase preview after verification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn verify
      - name: Deploy temporary Firebase preview
        if: >-
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_preview)
        uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AIRPORTFOLIO_F076F }}'
          projectId: airportfolio-f076f
          channelId: '${{ github.event_name == ''pull_request'' && format(''pr-{0}'', github.event.number) || format(''review-{0}'', github.run_id) }}'
          expires: 7d
          firebaseToolsVersion: 15.34.2
          disableComment: true
